name: Build Infinix X668C Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel Image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            bc \
            git \
            curl \
            rsync \
            python3 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Download AOSP Clang 12 (r416183b)
        run: |
          mkdir -p toolchain
          git clone --depth 1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android12-release toolchain/clang

      - name: Clone Baseline Kernel Source (Unisoc 5.4.147)
        run: |
          git clone --depth 1 -b nokiag11plus_v1.050 https://github.com/HMD-Nokia-OSS-Kernels/android_kernel_hmd_nokiag11plus.git source_tree

      - name: Match Stock Vermagic & Relax Module Checks
        run: |
          cd source_tree/android/kernel5.4
          
          # 1. Samakan string versi persis seperti kernel pabrik:
          # 5.4.147-android12-9-ge92ce1591700-ab376
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION = -android12-9-ge92ce1591700-ab376/' Makefile
          
          # 2. Patch kernel/module.c agar semua 156 driver vendor_boot diterima tanpa ditolak
          python3 -c "import re; p='kernel/module.c'; c=open(p).read(); c=re.sub(r'(static int check_version\([^)]+\)\s*\{)', r'\1\n\treturn 1;', c); c=c.replace('return strcmp(amagic, bmagic) == 0;', 'return 1;'); open(p, 'w').write(c)"
          
          # 3. Salin config Infinix dan hapus path private key pabrik
          cp $GITHUB_WORKSPACE/infinix_x668c_defconfig arch/arm64/configs/infinix_x668c_defconfig
          sed -i 's/CONFIG_MODULE_SIG_KEY=.*/CONFIG_MODULE_SIG_KEY=""/g' arch/arm64/configs/infinix_x668c_defconfig
          sed -i 's/CONFIG_MODULE_SIG=y/CONFIG_MODULE_SIG=n/g' arch/arm64/configs/infinix_x668c_defconfig
          sed -i 's/CONFIG_MODULE_SIG_ALL=y/# CONFIG_MODULE_SIG_ALL is not set/g' arch/arm64/configs/infinix_x668c_defconfig
          sed -i 's/CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/g' arch/arm64/configs/infinix_x668c_defconfig

      - name: Compile Kernel Image
        run: |
          cd source_tree/android/kernel5.4
          
          CLANG_PATH="$GITHUB_WORKSPACE/toolchain/clang/clang-r416183b/bin"
          export PATH="$CLANG_PATH:$PATH"
          
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- infinix_x668c_defconfig
          make -j$(nproc) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Prepare Artifact
        run: |
          mkdir -p output
          cp source_tree/android/kernel5.4/arch/arm64/boot/Image output/kernel
          sha256sum output/kernel > output/kernel.sha256

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: infinix_x668c_kernel
          path: output/kernel
